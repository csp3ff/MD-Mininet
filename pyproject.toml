[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-mininet"
version = "0.1.0"
description = "Multi-worker Mininet topology planning and distributed VXLAN runner for MDNET"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
md-mininet = "channel_mininet.cli:main"
md-controller = "controller.cli:main"

[project.optional-dependencies]
controller = ["ryu==4.34"]

[tool.setuptools.packages.find]
where = ["src"]
